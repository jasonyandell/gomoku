[project]
name = "gomoku"
version = "0.1.0"
description = "AlphaZero for 9x9 free-style gomoku on Apple Silicon"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jason Yandell" }]
dependencies = [
    "torch>=2.11",
    "numpy>=2.0",
    "wandb>=0.18",
    "tqdm>=4.66",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
]

[project.scripts]
gomoku-train = "gomoku.train:main"
gomoku-play = "gomoku.cli:main"
gomoku-web = "web.server:main"
gomoku-brain = "gomoku.gomocup_brain:main"
gomoku-eval-daemon = "gomoku.eval_daemon:main"
gomoku-lab-train = "gomoku.lab.trainer:main"
gomoku-lab-arena = "gomoku.lab.arena:main"
gomoku-lab-status = "gomoku.lab.status:main"
gomoku-lab = "gomoku.lab.up:main"
gomoku-lab-research = "gomoku.lab.research:main"

[build-system]
requires = ["setuptools>=69", "wheel", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gomoku*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
